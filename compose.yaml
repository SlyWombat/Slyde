# Portable Compose file. Copy .env.example -> .env, fill it in, then `docker compose up -d`.
# Works on any Docker host; nothing here is specific to a particular deployment.
services:
  slyde:
    build: .
    image: slyde:latest
    container_name: slyde
    restart: unless-stopped
    # The uid:gid the container runs as. Set SLYDE_UID / SLYDE_GID in .env to run it under a
    # dedicated account; /data must then be writable by that uid (see docs/USAGE.md).
    user: "${SLYDE_UID:-1000}:${SLYDE_GID:-1000}"
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - slyde-data:/data
    # To use UDP broadcast discovery (instead of setting FRAME_HOST), the container must share
    # the host's network so broadcasts reach the LAN. Uncomment and remove `ports:` above:
    # network_mode: host

volumes:
  slyde-data:
