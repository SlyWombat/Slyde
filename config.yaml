name: Slyde Frame Manager
version: "0.4.0"
slug: slyde
description: "Sync & rotate Immich photo albums onto a SwitchBot AI Art Frame (13.3\"/7.3\"/31.5\"), Memento, or Sungale e-paper frame"
url: "https://github.com/SlyWombat/Slyde"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:image-frame
panel_title: Slyde
homeassistant_api: true
ports:
  8080/tcp: null
options:
  frame_backend: "switchbot"
  immich_base_url: "http://immich:2283"
  immich_api_key: ""
  immich_asset_size: "preview"
  switchbot_delivery_mode: "ha_service"
  ha_art_frame_entity_id: "sensor.art_frame_local_images"
  switchbot_device_id: ""
  switchbot_frame_size: "13.3"
  switchbot_orientation: "portrait"
  frame_fit: "smart"
  frame_crop_tolerance: 0.12
  switchbot_max_image_bytes: 650000
  switchbot_slideshow: "slyde"
  switchbot_slideshow_interval_minutes: 60
  switchbot_quiet_hours: ""
  sync_interval_minutes: 60
  switchbot_token: ""
  switchbot_secret: ""
schema:
  frame_backend: "list(switchbot|memento-lan|sungale-cloud)"
  immich_base_url: str
  immich_api_key: password
  immich_asset_size: "list(preview|thumbnail|original)"
  switchbot_delivery_mode: "list(ha_service|cloud_only)"
  ha_art_frame_entity_id: str
  switchbot_device_id: "str?"
  switchbot_frame_size: "list(13.3|7.3|31.5)"
  switchbot_orientation: "list(portrait|landscape)"
  frame_fit: "list(smart|contain|cover|blur)"
  frame_crop_tolerance: "float(0,1)"
  switchbot_max_image_bytes: "int(100000,900000)"
  switchbot_slideshow: "list(slyde|frame|off)"
  switchbot_slideshow_interval_minutes: "int(1,43200)"
  switchbot_quiet_hours: "match(^$|^([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$)?"
  sync_interval_minutes: "int(0,10080)"
  switchbot_token: "password?"
  switchbot_secret: "password?"
