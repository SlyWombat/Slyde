# Example Dockge stack for "kdocker" (a NanoPi M5 / arm64 running Dockge).
# This is ONE example deployment — adjust the values in .env for your environment.
# Build the image first on the host:  docker build -t slyde:latest <repo>
services:
  slyde:
    image: slyde:latest
    container_name: slyde
    restart: unless-stopped
    # Run under a dedicated service account: set SLYDE_UID / SLYDE_GID in .env and own the
    # bind-mounted data dir by that uid:gid. Defaults to the image's own uid 1000.
    user: "${SLYDE_UID:-1000}:${SLYDE_GID:-1000}"
    env_file: .env
    ports:
      - "8090:8080"
    volumes:
      - /data/memento/data:/data
